name: Cloudflare computer checks

on:
  pull_request:
    paths:
      - 'cloudflare-computer/**'
      - 'src/server/cloudflare-computer-provider.ts'
      - 'src/server/computer-provider-factory.ts'
      - 'src/server/platform-config.ts'
      - 'src/server/index.ts'
      - 'tests/cloudflare-computer-provider.test.ts'
      - 'docs/CLOUDFLARE_COMPUTERS.md'
      - '.github/workflows/cloudflare-computer-check.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-computer/**'
      - 'src/server/cloudflare-computer-provider.ts'
      - 'src/server/computer-provider-factory.ts'
      - 'src/server/platform-config.ts'
      - 'src/server/index.ts'
      - 'tests/cloudflare-computer-provider.test.ts'
      - 'docs/CLOUDFLARE_COMPUTERS.md'
      - '.github/workflows/cloudflare-computer-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check Cloudflare computer Worker
        run: npx --yes wrangler deploy --dry-run --config cloudflare-computer/wrangler.jsonc
      - name: Check Cloudflare-specific formatting
        run: npx --yes prettier --check cloudflare-computer/worker.ts cloudflare-computer/wrangler.jsonc cloudflare-computer/README.md docs/CLOUDFLARE_COMPUTERS.md
