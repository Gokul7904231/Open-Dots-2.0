name: One-off Daytona formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/server/daytona-computer-provider.ts'

permissions:
  contents: write

jobs:
  format-provider:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/daytona-computer-provider-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/server/daytona-computer-provider.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/daytona-computer-provider.ts
          git commit -m "style(daytona): format provider adapter"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
