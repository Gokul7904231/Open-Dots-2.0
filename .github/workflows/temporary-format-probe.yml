name: Temporary format probe

on:
  push:
    branches:
      - fix/b2-supervisor-export-import-20261023

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Show the exact Prettier diff
        shell: bash
        run: |
          npx prettier deployment/computers/b2-archive-core.mjs > /tmp/b2-archive-core.formatted.mjs
          diff -u --label current/deployment/computers/b2-archive-core.mjs --label prettier/deployment/computers/b2-archive-core.mjs deployment/computers/b2-archive-core.mjs /tmp/b2-archive-core.formatted.mjs || true
