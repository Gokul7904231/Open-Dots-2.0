name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Temporary formatter and diff capture
        run: |
          npm run format
          echo "BEGIN_FORMAT_DIFF"
          git diff --no-ext-diff --unified=999999 -- src/server/dot-agent.ts src/server/embeddings.ts tests/embeddings.test.ts tests/tanstack-agent.test.ts README.md docs/SETUP.md
          echo "END_FORMAT_DIFF"
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
