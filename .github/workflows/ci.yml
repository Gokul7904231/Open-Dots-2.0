name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Temporary qualification formatting diagnostic
        run: |
          npx prettier --write scripts/qualify-computer.mjs package.json docs/COMPUTERS.md docs/COMPUTER_QUALIFICATION.md
          git diff --color=never -- scripts/qualify-computer.mjs package.json docs/COMPUTERS.md docs/COMPUTER_QUALIFICATION.md
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
