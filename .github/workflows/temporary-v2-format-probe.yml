name: Temporary V2 format probe

on:
  push:
    branches:
      - feat/odar-stream-v2-20261023

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Show exact formatter diff
        shell: bash
        run: |
          for file in src/server/backup/odar-stream-v2.ts tests/odar-stream-v2.test.ts; do
            npx prettier "$file" > "/tmp/$(basename "$file").formatted"
            diff -u --label "current/$file" --label "prettier/$file" "$file" "/tmp/$(basename "$file").formatted" || true
          done
