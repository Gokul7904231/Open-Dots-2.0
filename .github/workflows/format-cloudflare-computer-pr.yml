name: Temporary Cloudflare computer formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cloudflare-computer/**'
      - 'src/server/cloudflare-computer-provider.ts'
      - 'src/server/computer-provider-factory.ts'
      - 'src/server/platform-config.ts'
      - 'src/server/index.ts'
      - 'tests/cloudflare-computer-provider.test.ts'
      - 'docs/CLOUDFLARE_COMPUTERS.md'
      - 'docs/COMPUTER_PROVIDERS.md'
      - 'docs/COMPUTERS.md'
      - 'package.json'
      - '.env.example'
      - 'compose.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/cloudflare-container-computers-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: |
          npx prettier --write src/server/cloudflare-computer-provider.ts src/server/computer-provider-factory.ts src/server/platform-config.ts src/server/index.ts tests/cloudflare-computer-provider.test.ts docs/CLOUDFLARE_COMPUTERS.md docs/COMPUTER_PROVIDERS.md docs/COMPUTERS.md package.json compose.yml cloudflare-computer/worker.ts cloudflare-computer/wrangler.jsonc cloudflare-computer/README.md .github/workflows/cloudflare-computer-check.yml
      - name: Commit formatted changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/cloudflare-computer-provider.ts src/server/computer-provider-factory.ts src/server/platform-config.ts src/server/index.ts tests/cloudflare-computer-provider.test.ts docs/CLOUDFLARE_COMPUTERS.md docs/COMPUTER_PROVIDERS.md docs/COMPUTERS.md package.json .env.example compose.yml cloudflare-computer/worker.ts cloudflare-computer/wrangler.jsonc cloudflare-computer/README.md .github/workflows/cloudflare-computer-check.yml
          git commit -m "style(cloudflare): format computer runtime implementation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
